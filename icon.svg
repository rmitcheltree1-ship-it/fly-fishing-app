<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e2024"/>
      <stop offset="100%" stop-color="#1d3037"/>
    </linearGradient>
    <linearGradient id="drop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5be7e1"/>
      <stop offset="100%" stop-color="#1f8a86"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- water ripples -->
  <path d="M64 360 Q 128 330 192 360 T 320 360 T 448 360" stroke="#29b8b2" stroke-width="6" fill="none" opacity="0.45"/>
  <path d="M64 400 Q 128 370 192 400 T 320 400 T 448 400" stroke="#29b8b2" stroke-width="6" fill="none" opacity="0.3"/>
  <!-- big droplet -->
  <path d="M256 80 C 360 200 380 280 380 320 a 124 124 0 1 1 -248 0 c 0 -40 20 -120 124 -240 z" fill="url(#drop)" />
  <!-- highlight -->
  <ellipse cx="216" cy="280" rx="22" ry="48" fill="#e7f3f5" opacity="0.35"/>
  <!-- small fish -->
  <g transform="translate(108 420)" fill="#e6b35a">
    <path d="M0 0 Q 28 -18 56 0 Q 28 18 0 0 z"/>
    <path d="M56 0 l 14 -10 l 0 20 z"/>
  </g>
</svg>
