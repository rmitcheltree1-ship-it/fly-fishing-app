<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F7F2E9" />
  <meta name="description" content="Riffle is a modern river guidebook and fishing journal for live conditions, trips, flies, and field notes." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Riffle" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="riffle-icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="riffle-icon.png" />
  <title>Riffle — River Guide & Journal</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

  <style>
    :root {
      --bg: #F7F2E9;
      --bg-rgb: 247, 242, 233; /* for translucent appbar/tab backdrops */
      --bg-2: #FCF9F2;
      --bg-3: #EAE4D9;
      --line: #D8D0C3;
      --fg: #0B2C47;
      --muted: #657078;
      --teal: #15546B;
      --teal-2: #0B334D;
      --gold: #657D5B;
      --red: #A94B3F;
      --yellow: #B9863F;
      --card: #FFFDF8;
      --skeleton-hi: #DED7CB;
      --shadow: 0 10px 30px rgba(11, 44, 71, 0.08);
      --radius: 13px;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background: var(--bg);
      color: var(--fg);
      font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }
    body { padding-bottom: 72px; min-height: 100vh; }
    a { color: var(--teal); }
    button { font: inherit; color: inherit; cursor: pointer; }
    input, textarea, select {
      font: inherit; color: var(--fg);
      background: var(--bg-2);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      width: 100%;
    }
    input:focus, textarea:focus, select:focus { outline: 2px solid var(--teal); border-color: transparent; }

    header.appbar {
      position: sticky; top: 0; z-index: 10;
      background: rgba(var(--bg-rgb), 0.92);
      backdrop-filter: saturate(140%) blur(8px);
      border-bottom: 1px solid var(--line);
      padding: env(safe-area-inset-top) 14px 10px;
      display: flex; align-items: flex-end; justify-content: space-between;
      gap: 8px;
      min-height: 52px;
    }
    header.appbar h1 { margin: 0; font-size: 19px; font-weight: 800; letter-spacing: 0.12em; }
    .title-cluster { display:flex; align-items:center; gap:10px; min-width:0; }
    .brand-mark { width:38px; height:38px; flex:none; border-radius:11px; box-shadow:0 5px 14px rgba(11,44,71,.18); }
    header.appbar .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
    header.appbar .actions { display: flex; gap: 8px; }
    header.appbar .appbar-right { display: flex; align-items: center; gap: 8px; }
    .account-btn {
      width: 34px; height: 34px; flex: none;
      border-radius: 50%;
      border: 1.5px solid var(--line);
      background: var(--card);
      color: var(--muted);
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700;
      cursor: pointer; padding: 0;
      position: relative;
    }
    .account-btn.signed-in { border-color: var(--teal); background: var(--teal); color: #fff; }
    .account-btn .sync-dot {
      position: absolute; top: -1px; right: -1px;
      width: 9px; height: 9px; border-radius: 50%;
      border: 2px solid var(--bg); display: none;
    }
    .account-btn.sync-syncing .sync-dot { display: block; background: var(--gold); }
    .account-btn.sync-error   .sync-dot { display: block; background: var(--red); }
    .icon-btn {
      background: var(--bg-2); border: 1px solid var(--line);
      border-radius: 10px; padding: 8px 10px; color: var(--fg);
      display: inline-flex; align-items: center; gap: 6px;
    }
    .icon-btn:active { transform: scale(0.97); }

    nav.tabs {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
      background: rgba(var(--bg-rgb), 0.96);
      backdrop-filter: saturate(140%) blur(10px);
      border-top: 1px solid var(--line);
      display: flex;
      padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
    }
    nav.tabs button {
      flex: 1;
      background: transparent; border: 0;
      padding: 6px 4px; border-radius: 10px;
      color: var(--muted);
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      font-size: 11px;
    }
    nav.tabs button.active { color: var(--teal); }
    nav.tabs button svg { width: 22px; height: 22px; }

    main { padding: 12px 14px; }
    .panel { display: none; }
    .panel.active { display: block; }

    .search {
      position: relative;
      margin-bottom: 12px;
    }
    .search input { padding-left: 36px; }
    .search svg {
      position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
      width: 18px; height: 18px; opacity: 0.6;
    }

    .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 8px; }
    .chip {
      flex: 0 0 auto;
      padding: 5px 12px; border-radius: 999px;
      background: var(--bg-2); border: 1px solid var(--line);
      color: var(--muted); font-size: 13px;
    }
    .chip.active { background: var(--teal); color: #fff; border-color: var(--teal); font-weight: 600; }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 12px;
    }
    .card h3 { margin: 0 0 8px; font-size: 15px; letter-spacing: -0.005em; }
    .row {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
    }
    .row:last-child { border-bottom: 0; }
    .row .label { color: var(--muted); font-size: 13px; }
    .row .value { font-weight: 600; text-align: right; }

    .river-row {
      display: flex; align-items: center; gap: 12px;
      padding: 12px;
      background: var(--card); border: 1px solid var(--line);
      border-radius: var(--radius); margin-bottom: 8px;
      width: 100%; text-align: left;
    }
    .river-row .drop {
      width: 36px; height: 36px; border-radius: 12px;
      background: linear-gradient(135deg, var(--teal) 0%, var(--teal-2) 100%);
      display: flex; align-items: center; justify-content: center;
      flex: 0 0 auto;
    }
    .river-row .meta { flex: 1; min-width: 0; }
    .river-row .name { font-weight: 600; }
    .river-row .sub { color: var(--muted); font-size: 12px; }
    .river-row .star { background: transparent; border: 0; padding: 6px; }
    .river-row.smart {
      align-items: stretch;
      padding: 0;
      overflow: hidden;
      background: var(--card);
    }
    .river-row.smart .status-stripe {
      width: 5px;
      align-self: stretch;
      flex: 0 0 5px;
      background: var(--teal);
    }
    .river-row.smart .river-main {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      flex: 1;
      min-width: 0;
    }
    .water-chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }
    .water-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--bg-3);
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      line-height: 1.35;
    }
    .water-chip.good { background: rgba(58,167,109,0.15); color: #3aa76d; }
    .water-chip.warn { background: rgba(224,146,47,0.16); color: #e0922f; }
    .water-chip.danger { background: rgba(217,83,79,0.16); color: #d9534f; }
    .water-chip.info { background: rgba(58,123,213,0.14); color: #3a7bd5; }
    .water-chip.muted { background: var(--bg-3); color: var(--muted); }
    .personal-context {
      color: var(--teal);
      font-size: 12px;
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .waters-board {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 4px;
    }
    .water-status-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 11px 12px;
      text-align: left;
      box-shadow: var(--shadow);
    }
    .water-status-card .k {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 700;
    }
    .water-status-card .v {
      font-size: 22px;
      font-weight: 800;
      line-height: 1.1;
      margin-top: 3px;
      color: var(--fg);
    }
    .water-status-card .s {
      color: var(--muted);
      font-size: 11px;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .smart-section-card {
      background: var(--bg-2);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 10px;
      margin-bottom: 10px;
    }
    .smart-section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }
    .smart-section-title {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .smart-section-count {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }
    @media (min-width: 720px) {
      .waters-board { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .river-row.smart .river-main { padding: 14px 16px; }
    }

    .metrics-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
    }
    .metric {
      background: var(--bg-3);
      border-radius: 12px;
      padding: 10px 8px;
      text-align: center;
      display: flex; flex-direction: column; align-items: center; gap: 2px;
    }
    .metric .ico { font-size: 18px; }
    .metric .v { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .metric .u { font-size: 11px; color: var(--muted); }
    .metric .l { font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }

    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 6px;
      padding: 12px 16px; border-radius: 12px;
      background: var(--teal); color: #fff;
      border: 0; font-weight: 600;
      width: 100%;
    }
    .btn.secondary { background: var(--bg-3); color: var(--fg); }
    .btn.danger { background: var(--red); color: white; }
    .btn:disabled { opacity: 0.5; }

    .fab {
      position: fixed; right: 16px; bottom: calc(76px + env(safe-area-inset-bottom));
      width: 56px; height: 56px; border-radius: 28px;
      background: var(--teal); color: #fff;
      border: 0; box-shadow: var(--shadow);
      display: flex; align-items: center; justify-content: center;
      z-index: 8;
    }
    .fab svg { width: 26px; height: 26px; }

    .empty {
      text-align: center; padding: 40px 20px; color: var(--muted);
    }
    .empty svg { width: 52px; height: 52px; color: var(--teal); opacity: 0.7; margin-bottom: 8px; }
    .empty h3 { margin: 8px 0 4px; color: var(--fg); }

    .fly-grid {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;
    }
    .fly-card {
      background: var(--bg-2); border: 1px solid var(--line);
      border-radius: var(--radius); overflow: hidden;
      display: flex; flex-direction: column;
      text-align: left;
      cursor: pointer;
    }
    .fly-card .hero {
      height: 96px;
      background: linear-gradient(135deg, rgba(46,125,92,0.15), rgba(45,106,142,0.08));
      display: flex; align-items: center; justify-content: center;
      position: relative;
    }
    .fly-card .hero img { width: 100%; height: 100%; object-fit: cover; }
    .fly-card .hero svg { width: 36px; height: 36px; color: var(--teal); }
    .fly-card .hero .star {
      position: absolute; top: 6px; right: 6px;
      color: var(--yellow);
    }
    .fly-card .body { padding: 8px 10px; }
    .fly-card .name { font-weight: 600; font-size: 14px; }
    .fly-card .desc { color: var(--muted); font-size: 12px; }

    #map { width: 100%; height: calc(100vh - 200px); min-height: 320px; border-radius: var(--radius); }

    .modal-bg {
      position: fixed; inset: 0; z-index: 100;
      background: rgba(0,0,0,0.6); backdrop-filter: blur(2px);
      display: none; align-items: flex-end;
    }
    .modal-bg.open { display: flex; }
    .modal {
      background: var(--bg); width: 100%; max-height: 92vh;
      border-radius: 18px 18px 0 0; overflow: auto;
      padding: 16px 14px calc(20px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--line);
    }
    .modal-handle {
      width: 40px; height: 4px; border-radius: 2px;
      background: var(--line); margin: 0 auto 14px;
    }
    .modal-head {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 8px;
    }
    .modal-head h2 { margin: 0; font-size: 18px; }
    .modal-head .close { background: transparent; border: 0; color: var(--muted); padding: 4px; }
    .modal-head .close svg { width: 24px; height: 24px; }

    .gauge-results {
      max-height: 220px; overflow-y: auto;
      border: 1px solid var(--line); border-radius: 10px;
      margin-top: 8px;
    }
    .gauge-result-row {
      width: 100%; text-align: left; padding: 10px 12px;
      background: transparent; border: 0; border-bottom: 1px solid var(--line);
      display: block; cursor: pointer;
    }
    .gauge-result-row:last-child { border-bottom: 0; }
    .gauge-result-row:active { background: var(--bg-3); }
    .gauge-result-name { font-size: 13px; font-weight: 600; line-height: 1.3; }
    .gauge-result-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .gauge-src-badge {
      display: inline-block; padding: 1px 5px; border-radius: 4px;
      font-size: 10px; font-weight: 700; letter-spacing: 0.04em;
      text-transform: uppercase; vertical-align: middle; line-height: 1.5;
    }
    .gauge-src-badge.dwr  { background: rgba(46,125,92,0.18); color: var(--teal); }
    .gauge-src-badge.usgs { background: rgba(45,106,142,0.15); color: #2d6a8e; }

    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    .trip-row { display: block; cursor: pointer; }
    .trip-row .top { display: flex; justify-content: space-between; align-items: baseline; }
    .trip-row .where { font-weight: 600; }
    .trip-row .when { color: var(--muted); font-size: 12px; }
    .trip-row .stats { color: var(--muted); font-size: 12px; margin-top: 4px; }

    .memo-row {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 0; border-top: 1px solid var(--line);
    }
    .memo-row .play {
      width: 36px; height: 36px; border-radius: 18px;
      background: var(--teal); color: #fff; border: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .memo-row.playing .play { background: var(--red); color: white; }
    .memo-row .meta { flex: 1; min-width: 0; }
    .memo-row .label { font-size: 14px; }
    .memo-row .dur { font-size: 11px; color: var(--muted); }
    .memo-row .del { background: transparent; border: 0; color: var(--red); padding: 4px; }

    .record-btn {
      width: 100%;
      background: var(--bg-3); color: var(--fg);
      border: 1px solid var(--line);
      border-radius: 12px; padding: 14px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .record-btn.recording { background: var(--red); color: white; }
    .record-btn .dot {
      width: 10px; height: 10px; border-radius: 5px; background: var(--red);
      animation: pulse 1s infinite;
    }
    .record-btn.recording .dot { background: white; }
    @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: 0.3 } }

    .toast {
      position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%);
      background: var(--bg-3); color: var(--fg);
      padding: 10px 16px; border-radius: 20px;
      border: 1px solid var(--line); box-shadow: var(--shadow);
      font-size: 14px;
      opacity: 0; pointer-events: none; transition: opacity 0.2s;
      z-index: 200;
    }
    .toast.show { opacity: 1; }

    .update-banner {
      position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%) translateY(20px);
      display: flex; align-items: center; gap: 12px;
      background: var(--teal); color: #fff;
      padding: 10px 12px 10px 16px; border-radius: 22px;
      box-shadow: var(--shadow); font-size: 14px; font-weight: 600;
      opacity: 0; pointer-events: none; transition: opacity 0.25s, transform 0.25s;
      z-index: 210;
    }
    .update-banner.show { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0); }
    .update-banner button {
      background: rgba(255,255,255,0.22); color: #fff; border: 0;
      padding: 6px 14px; border-radius: 16px; font-weight: 700; font-size: 13px;
    }

    .diagram {
      background: var(--bg-3); padding: 12px; border-radius: 10px;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 13px; line-height: 1.6;
      white-space: pre-wrap;
    }

    .skeleton {
      background: linear-gradient(90deg, var(--bg-3) 25%, var(--skeleton-hi) 50%, var(--bg-3) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 6px;
    }
    @keyframes shimmer { from { background-position: 200% 0 } to { background-position: -200% 0 } }

    /* Riffle 0.5 — Modern Guidebook + River Journal */
    body {
      letter-spacing: -0.005em;
      background-image:
        radial-gradient(ellipse at 12% 8%, transparent 0 34px, rgba(21,84,107,.035) 35px 36px, transparent 37px 48px, rgba(21,84,107,.025) 49px 50px, transparent 51px),
        radial-gradient(circle at 80% 2%, rgba(255,255,255,.6), transparent 34%);
      background-size:180px 150px, auto;
    }
    button, input, textarea, select { min-height: 44px; }
    header.appbar { padding-left:max(14px, env(safe-area-inset-left)); padding-right:max(14px, env(safe-area-inset-right)); box-shadow:0 1px 12px rgba(25,53,45,.05); }
    nav.tabs { padding-left:max(4px, env(safe-area-inset-left)); padding-right:max(4px, env(safe-area-inset-right)); box-shadow:0 -4px 20px rgba(25,53,45,.06); }
    nav.tabs button.active { background:rgba(21,84,107,.085); color:var(--teal-2); }
    main { width:100%; max-width:1120px; margin:0 auto; padding:18px clamp(14px, 3vw, 28px); }
    .card, .river-row, .fly-card, .smart-section-card, .water-status-card { box-shadow:0 1px 0 rgba(255,255,255,.62), 0 7px 24px rgba(11,44,71,.045); }
    .card h3, .modal-head h2 { color:var(--fg); font-weight:750; }
    .btn { min-height:46px; box-shadow:0 4px 12px rgba(31,90,70,.16); }
    .btn.secondary { background:var(--card); border:1px solid var(--line); box-shadow:none; }
    .icon-btn { min-width:44px; min-height:44px; justify-content:center; background:var(--card); }
    .account-btn { width:44px; height:44px; }
    .fab { width:58px; height:58px; box-shadow:0 10px 28px rgba(31,90,70,.28); }
    .modal-bg { background:rgba(12,27,22,.56); }
    .modal { background:var(--bg); box-shadow:0 -18px 60px rgba(12,27,22,.22); }
    input, textarea, select { background:var(--card); }
    .empty { margin:18px 0; border:1px dashed var(--line); border-radius:var(--radius); background:rgba(255,253,248,.58); }
    #map { border:1px solid var(--line); box-shadow:var(--shadow); }
    .toast { background:var(--fg); color:var(--bg); border-color:transparent; }
    .home-journal { max-width:760px; margin:0 auto; padding:4px 0 28px; }
    .home-welcome { padding:14px 2px 16px; }
    .home-welcome h2 { margin:0; font-size:22px; letter-spacing:-.025em; }
    .home-welcome p { margin:3px 0 0; color:var(--muted); font-size:13px; }
    .home-feature-card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:15px; margin-bottom:14px; box-shadow:0 8px 26px rgba(11,44,71,.055); }
    .home-kicker { color:var(--muted); font-size:10px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; margin-bottom:10px; }
    .home-feature-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
    .home-feature-head h3, .recent-trip h3 { margin:0; font-size:15px; }
    .home-feature-head p { margin:2px 0 0; color:var(--muted); font-size:12px; }
    .home-link { min-height:34px; padding:6px 10px; border:1px solid var(--line); border-radius:9px; background:var(--bg-2); color:var(--teal); font-size:11px; font-weight:700; }
    .home-condition-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:14px; padding-top:13px; border-top:1px solid var(--line); }
    .home-condition-grid > div { min-width:0; }
    .home-condition-grid strong { display:block; color:var(--fg); font-size:17px; line-height:1.15; overflow:hidden; text-overflow:ellipsis; }
    .home-condition-grid span { display:block; color:var(--muted); font-size:9px; text-transform:uppercase; letter-spacing:.055em; margin-top:4px; }
    .home-spark { min-height:6px; margin-top:10px; overflow:hidden; }
    .home-trip-button, .home-trip-empty { width:100%; min-height:92px; padding:0; border:0; background:transparent; display:flex; align-items:stretch; gap:14px; text-align:left; }
    .home-trip-copy { flex:1; min-width:0; }
    .home-trip-date { color:var(--muted); font-size:11px; margin-bottom:4px; }
    .home-trip-copy p, .home-trip-empty p { margin:6px 0 0; color:var(--muted); font-size:12px; line-height:1.45; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .home-trip-meta { color:var(--teal); font-size:11px; font-weight:700; margin-top:8px; }
    .home-trip-photo { width:96px; min-height:92px; border-radius:11px; object-fit:cover; flex:none; border:1px solid var(--line); }
    .home-trip-photo.placeholder { display:flex; align-items:center; justify-content:center; background:linear-gradient(145deg, rgba(101,125,91,.2), rgba(21,84,107,.12)); color:var(--teal); }
    .home-trip-empty { align-items:center; }
    .home-trip-empty .home-trip-photo { min-height:76px; height:76px; }
    .home-suggestion { background:var(--card); border:1px solid var(--line); border-left:3px solid var(--gold); border-radius:12px; padding:12px 14px; }
    .catch-section-head { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:10px; }
    .catch-section-head h3 { margin-bottom:1px; }
    .catch-count { color:var(--muted); font-size:11px; }
    .catch-card { display:flex; align-items:flex-start; gap:11px; padding:11px 0; border-top:1px solid var(--line); position:relative; }
    .catch-photo { width:72px; height:72px; object-fit:cover; border-radius:11px; border:1px solid var(--line); flex:none; }
    .catch-photo.placeholder { display:flex; align-items:center; justify-content:center; color:var(--teal); background:linear-gradient(145deg, rgba(101,125,91,.2), rgba(21,84,107,.12)); }
    .catch-copy { flex:1; min-width:0; }
    .catch-time { color:var(--muted); font-size:10px; }
    .catch-copy h4 { margin:2px 0; font-size:15px; }
    .catch-meta { color:var(--teal); font-size:11px; font-weight:700; }
    .catch-copy p { color:var(--muted); font-size:12px; margin:5px 0 0; }
    .catch-delete { width:36px; min-height:36px; border:0; border-radius:9px; background:transparent; color:var(--red); padding:7px; }
    .catch-empty { color:var(--muted); font-size:12px; padding:12px 0 2px; border-top:1px solid var(--line); }
    .catch-photo-picker { min-height:112px; border:1px dashed var(--line); border-radius:12px; background:var(--card); display:flex; align-items:center; justify-content:center; color:var(--teal); font-size:13px; font-weight:700; cursor:pointer; overflow:hidden; }
    .catch-photo-picker img { width:100%; height:180px; object-fit:cover; }
    @media (min-width: 760px) {
      body { padding-bottom:88px; }
      nav.tabs { left:50%; right:auto; transform:translateX(-50%); bottom:16px; width:min(620px, calc(100% - 32px)); border:1px solid var(--line); border-radius:20px; padding:7px; box-shadow:var(--shadow); }
      .fly-grid { grid-template-columns:repeat(3, minmax(0,1fr)); gap:16px; }
      .modal-bg { align-items:center; justify-content:center; padding:24px; }
      .modal { max-width:680px; max-height:88vh; border:1px solid var(--line); border-radius:20px; padding:20px 22px; }
      .modal-handle { display:none; }
      .hero-card { flex-basis:min(520px, 70vw); }
      .home-journal { padding-top:18px; }
      .home-welcome h2 { font-size:28px; }
      .home-feature-card { padding:20px; }
      .home-trip-photo { width:150px; min-height:112px; }
    }
    @media (min-width: 960px) {
      .home-journal { max-width:1040px; display:grid; grid-template-columns:minmax(0, 1.12fr) minmax(0, .88fr); gap:16px; align-items:stretch; }
      .home-welcome, .home-suggestion { grid-column:1 / -1; }
      .home-feature-card { margin:0; min-height:250px; }
      .current-conditions { display:flex; flex-direction:column; }
      .current-conditions .home-spark { margin-top:auto; }
      .recent-trip .home-trip-button { min-height:172px; }
      .recent-trip .home-trip-photo { width:170px; min-height:172px; }
      .home-suggestion { margin-top:0; }
    }

    .leaflet-popup-content { color: #111; }

    /* river card right-side CFS block */
    .river-right {
      display: flex; flex-direction: column; align-items: flex-end; gap: 1px;
    }
    .river-cfs .cfs-v {
      font-size: 22px; font-weight: 700; color: var(--teal);
      line-height: 1; text-align: right;
    }
    .river-cfs .cfs-u {
      font-size: 10px; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.04em; text-align: right;
    }
    .trend-rising  { color: var(--teal); font-weight: 700; }
    .trend-falling { color: var(--red);  font-weight: 700; }
    .trend-stable  { color: var(--muted); }

    /* conditions section headers */
    .cond-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 6px; margin-top: 10px;
    }
    .cond-header:first-child { margin-top: 0; }
    .cond-src {
      font-size: 10px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted);
    }
    .cond-time { font-size: 10px; color: var(--muted); }

    /* ===== Hero card swiper ===== */
    .swiper-section { margin: 0 -14px 16px; }
    .swiper-track {
      display: flex; overflow-x: scroll; scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch; scrollbar-width: none;
      gap: 10px; padding: 4px 14px 10px;
    }
    .swiper-track::-webkit-scrollbar { display: none; }
    .hero-card {
      flex: 0 0 calc(85vw);
      scroll-snap-align: start;
      border-radius: var(--radius);
      padding: 16px 18px;
      min-height: 215px;
      display: flex; flex-direction: column; justify-content: space-between;
      text-align: left;
      -webkit-tap-highlight-color: transparent;
      transition: opacity 0.15s;
    }
    .hero-card:active { opacity: 0.85; }
    .h-badge {
      display: inline-block; padding: 3px 10px; border-radius: 99px;
      background: rgba(255,255,255,0.18); color: #fff;
      font-size: 11px; font-weight: 700; letter-spacing: 0.06em;
    }
    .h-name { font-size: 20px; font-weight: 800; color: #fff; line-height: 1.15; margin-top: 6px; }
    .h-section { font-size: 12px; color: rgba(255,255,255,0.7); margin-top: 2px; }
    .h-cfs-row { display: flex; align-items: baseline; gap: 6px; margin-top: 10px; }
    .h-cfs { font-size: 46px; font-weight: 900; color: #fff; line-height: 1; font-variant-numeric: tabular-nums; }
    .h-cfs-unit { font-size: 14px; color: rgba(255,255,255,0.6); }
    .h-trend { font-size: 12px; color: rgba(255,255,255,0.72); margin-top: 3px; }
    .h-bottom { display: flex; gap: 10px; font-size: 11px; color: rgba(255,255,255,0.62); flex-wrap: wrap; }
    .swiper-dots { display: flex; justify-content: center; gap: 5px; padding: 2px 0 0; }
    .swiper-dot { width: 6px; height: 6px; border-radius: 3px; background: var(--bg-3); transition: all 0.25s; }
    .swiper-dot.active { background: var(--teal); width: 18px; }
    .swiper-hint { text-align: center; padding: 18px 14px 10px; color: var(--muted); font-size: 13px; display: flex; flex-direction: column; align-items: center; gap: 6px; }

    /* ===== Quick Session ===== */
    .session-banner {
      position: fixed; left: 0; right: 0;
      bottom: calc(60px + env(safe-area-inset-bottom));
      z-index: 9;
      background: var(--teal-2);
      color: #fff;
      display: none;
      align-items: center;
      gap: 10px;
      padding: 11px 14px;
      border-top: 1px solid rgba(255,255,255,0.12);
    }
    .session-banner.active { display: flex; }
    body.session-on { padding-bottom: 135px; }
    .s-info { flex: 1; min-width: 0; }
    .s-river { font-weight: 700; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .s-timer { font-size: 11px; opacity: 0.72; font-variant-numeric: tabular-nums; }
    .s-fish { display: flex; align-items: center; gap: 5px; }
    .s-count { font-size: 20px; font-weight: 800; line-height: 1; }
    .s-fish-ico { font-size: 15px; opacity: 0.8; }
    .s-plus {
      width: 36px; height: 36px; border-radius: 18px;
      background: rgba(255,255,255,0.22); border: 1px solid rgba(255,255,255,0.3);
      color: #fff; font-size: 26px; font-weight: 300; line-height: 1;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: transform 0.1s;
    }
    .s-end {
      padding: 8px 13px; border-radius: 9px;
      background: rgba(0,0,0,0.22); border: 0;
      color: #fff; font-size: 12px; font-weight: 700; flex-shrink: 0;
    }
  </style>
</head>
<body>

<header class="appbar">
  <div class="title-cluster">
    <img class="brand-mark" src="riffle-icon.svg" alt="" />
    <div>
      <h1 id="page-title">Riffle</h1>
      <div class="sub" id="page-sub">River guide & journal</div>
    </div>
  </div>
  <div class="appbar-right">
    <div class="actions" id="page-actions"></div>
    <button id="account-btn" class="account-btn" aria-label="Account & sync">
      <span class="acct-glyph">○</span><span class="sync-dot"></span>
    </button>
  </div>
</header>

<main>
  <section id="panel-home" class="panel active"></section>
  <section id="panel-rivers" class="panel"></section>
  <section id="panel-trips" class="panel"></section>
  <section id="panel-flies" class="panel"></section>
  <section id="panel-leaders" class="panel"></section>
  <section id="panel-map" class="panel"></section>
  <section id="panel-reports" class="panel"></section>
</main>

<nav class="tabs" id="tabs">
  <button data-tab="home" class="active" aria-label="Home">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l9 8h-3v9h-4v-6h-4v6H6v-9H3l9-8z"/></svg>
    <span>Home</span>
  </button>
  <button data-tab="rivers" aria-label="Waters">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2s7 8.5 7 13a7 7 0 11-14 0c0-4.5 7-13 7-13z"/></svg>
    <span>Waters</span>
  </button>
  <button data-tab="trips" aria-label="Log">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 4a2 2 0 012-2h11a3 3 0 013 3v15a2 2 0 01-2 2H6a2 2 0 01-2-2V4zm3 1v14h11V5H7z"/></svg>
    <span>Log</span>
  </button>
  <button data-tab="reports" aria-label="Insights">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 20V9h4v11H4zm6 0V4h4v16h-4zm6 0v-6h4v6h-4z"/></svg>
    <span>Insights</span>
  </button>
  <button data-tab="flies" aria-label="Fly Box">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c2 2 3 5 3 7s-1 4-3 4-3-2-3-4 1-5 3-7zm-6 9c2 0 5 1 7 3s3 5 3 7c-2 0-5-1-7-3s-3-5-3-7zm12 0c0 2-1 5-3 7s-5 3-7 3c0-2 1-5 3-7s5-3 7-3z"/></svg>
    <span>Fly Box</span>
  </button>
</nav>

<div class="modal-bg" id="modal-bg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<button id="session-fab" class="fab" aria-label="Start fishing session"></button>

<div id="session-banner" class="session-banner">
  <div class="s-info">
    <div class="s-river" id="s-river-name"></div>
    <div class="s-timer" id="s-timer-display">00:00</div>
  </div>
  <div class="s-fish">
    <span class="s-count" id="s-fish-count">0</span>
    <span class="s-fish-ico">🐟</span>
  </div>
  <button class="s-plus" id="s-plus-btn" aria-label="Count a fish">+</button>
  <button class="s-end" id="s-end-btn">End</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="sync-core.js"></script>
<script src="app.js"></script>

<div id="update-banner" class="update-banner">
  <span>New version ready</span>
  <button id="update-reload-btn">Reload</button>
</div>

<script>
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    // True only when a previous version controls the page — distinguishes a
    // real update from the very first install (which also fires controllerchange).
    const hadController = !!navigator.serviceWorker.controller;
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(()=>{});
    });
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!hadController) return;
      document.getElementById('update-banner').classList.add('show');
    });
    document.getElementById('update-reload-btn').addEventListener('click', () => location.reload());
  }
</script>

</body>
</html>
